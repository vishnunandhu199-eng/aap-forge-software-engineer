<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - App Forge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body class="bg-gray-100">

  <!-- PAIKI NAVBAR -->
  <div class="bg-white shadow p-4 flex justify-between">
    <h1 class="text-2xl font-bold text-blue-600">App Forge</h1>
    <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded">Logout</button>
  </div>

  <!-- MADHYALO TASKS -->
  <div class="max-w-3xl mx-auto p-6">
    <button onclick="addTask()" class="bg-blue-600 text-white px-5 py-2 rounded mb-4">+ Add New Task</button>
    <div id="taskList">Loading...</div>
  </div>

<script>
const db = firebase.firestore();
let currentUser;

// Login check
auth.onAuthStateChanged(user => {
  if(user){ 
    currentUser = user;
    loadTasks();
  } else { 
    window.location = "login.html" 
  }
});

// Tasks chupinchadam
function loadTasks(){
  db.collection("tasks").where("uid", "==", currentUser.uid)
  .onSnapshot(snapshot => {
    taskList.innerHTML = "";
    snapshot.forEach(doc => {
      let task = doc.data();
      taskList.innerHTML += `<div class="bg-white p-3 rounded shadow mb-2 flex justify-between">
        ${task.text} 
        <button onclick="deleteTask('${doc.id}')" class="text-red-500">Delete</button>
      </div>`;
    })
  })
}

// Task add cheyyadam
function addTask(){
  let text = prompt("Kotha task enti?");
  if(text){
    db.collection("tasks").add({ text: text, uid: currentUser.uid })
  }
}

// Task delete cheyyadam
function deleteTask(id){
  db.collection("tasks").doc(id).delete();
}

// Logout
function logout(){ auth.signOut(); }
</script>
</body>
</html>
