<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - App Forge</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #f4f4f4; }
        .header { display: flex; justify-content: space-between; background: white; padding: 15px; border-radius: 8px; }
        #addTaskBtn { background: blue; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 20px 0; }
        #logoutBtn { background: red; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .task { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>App Forge</h2>
        <div>
            <span id="userName">Loading...</span>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>

    <button id="addTaskBtn">+ Add New Task</button>
    <div id="taskList">Loading...</div>

    <hr>
<h3>📷 Image Upload</h3>
<input type="file" id="imageInput">
<button id="uploadBtn">Upload to ImgBB</button>
<p id="uploadResult"></p>

<script>
const IMGBB_API_KEY = "214502d122e9435203d07d047839f7b8";

document.getElementById('uploadBtn').onclick = async () => {
  const file = document.getElementById('imageInput').files[0];
  if(!file) return alert('Photo select cheyyi');
  
  let form = new FormData();
  form.append('image', file);
  document.getElementById('uploadResult').innerText = 'Uploading...';
  
  let res = await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_API_KEY, {method:'POST', body:form});
  let data = await res.json();
  
  if(data.success){
    document.getElementById('uploadResult').innerHTML = 'Link: <a href="'+data.data.url+'" target="_blank">'+data.data.url+'</a>';
  } else {
    document.getElementById('uploadResult').innerText = 'Failed';
  }
}
</script>

    <script>
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('userName').textContent = user.email;
                loadTasks(user.uid);
            } else {
                window.location.href = 'index.html';
            }
        });

        function loadTasks(uid) {
            db.collection("tasks").where("userId", "==", uid).onSnapshot(snapshot => {
                const taskList = document.getElementById('taskList');
                taskList.innerHTML = "";
                if (snapshot.empty) {
                    taskList.innerHTML = "<p>No tasks yet. Click '+ Add New Task'</p>";
                }
                snapshot.forEach(doc => {
                    const task = doc.data();
                    taskList.innerHTML += `<div class="task"><h3>${task.title}</h3></div>`;
                });
            });
        }

        document.getElementById('addTaskBtn').onclick = () => {
            const title = prompt("Enter task name:");
            if (title) {
                db.collection("tasks").add({
                    title: title,
                    userId: auth.currentUser.uid,
                    createdAt: new Date()
                });
            }
        };

        document.getElementById('logoutBtn').onclick = () => auth.signOut();
    </script>
</body>
</html>
